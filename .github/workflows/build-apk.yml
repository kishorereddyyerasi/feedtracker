name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android || echo "Android platform already exists"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Create notification icon and channel
        run: |
          # Create a simple white notification icon (required by Android)
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_notification.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="24dp" android:height="24dp"
            android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF"
              android:pathData="M12,2C8.69,2 6,4.69 6,8v4l-2,2v1h16v-1l-2,-2V8c0,-3.31 -2.69,-6 -6,-6zM12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.9,2 2,2z"/>
          </vector>
          EOF

          # Create notification channel in Android strings
          mkdir -p android/app/src/main/res/values
          # Append channel config to strings.xml if it exists, else create it
          if [ -f android/app/src/main/res/values/strings.xml ]; then
            sed -i 's|</resources>|    <string name="default_notification_channel_id">feedtracker</string>\n</resources>|' android/app/src/main/res/values/strings.xml
          else
            echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="default_notification_channel_id">feedtracker</string></resources>' > android/app/src/main/res/values/strings.xml
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: feedtracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FeedTracker v${{ github.run_number }}
          body: |
            ## FeedTracker Android App

            ### Install Instructions
            1. Download `feedtracker-debug.apk` below
            2. On your Android phone: Settings → Security → Enable "Install unknown apps"
            3. Open the downloaded APK and tap Install
            4. Open FeedTracker from your app drawer

            ### What's included
            - Breastfeeding session tracker with live timer
            - Next feed countdown with configurable interval
            - Baby tracker (Urine / Motion / Diaper)
            - Medicine tracker with dosage & frequency
            - Baby profile with age display
            - Export all data to CSV
            - Background push notifications for feed reminders
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
